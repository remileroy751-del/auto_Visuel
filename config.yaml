langue: "français"
info_file: "info.xlsx"

# Mode validation : le logiciel affiche un aperçu et demande confirmation avant de publier
# (ne s'applique qu'en lancement manuel dans un terminal)
mode_validation: false

planning:
  publications: ["08:00", "19:30"]   # matin et soir
  fuseau_horaire: "Africa/Lome"
  max_par_jour: 2

ia:
  ordre: ["gemini", "groq"]          # bascule automatique si l'un échoue / atteint son quota
  gemini_model: "gemini-2.5-flash"
  groq_model: "llama-3.3-70b-versatile"

video:
  duree: 10
  fps: 30
  largeur: 1080
  hauteur: 1920
  musique: true                      # utilise un fichier au hasard dans music/ (s'il y en a)

facebook:
  actif: true
  type: "video"                      # "video" ou "photo"

tiktok:
  actif: true
  # SELF_ONLY tant que ton app n'a pas passé l'audit TikTok.
  # Ensuite : PUBLIC_TO_EVERYONE
  privacy_level: "SELF_ONLY"

# Fonds des visuels : essayés dans cet ordre, dégradé de couleur si tout échoue
#  pollinations : illustration IA liée au texte (clé POLLINATIONS_API_KEY)  <- 1er choix
#  gemini_image : image générée par Gemini (même clé GEMINI_API_KEY)
#  pexels       : vraies photos pro (clé gratuite PEXELS_API_KEY)
fond:
  ordre: ["pollinations", "gemini_image", "pexels"]
  gemini_image_model: "gemini-2.5-flash-image"
  pollinations_model: "flux"          # autres : gptimage, seedream... (selon ton compte)

dossiers:
  sortie: "output"
  musique: "music"
